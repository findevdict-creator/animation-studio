[project]
name = "animation-studio"
version = "0.1.0"
description = "Story-to-production-data pipeline: text agents in, deterministic Blender render data out."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
openai = ["openai>=1.40"]          # OpenAI, DeepSeek and OpenAI-compatible endpoints
gemini = ["google-genai>=1.20"]
all-providers = ["openai>=1.40", "google-genai>=1.20"]

[project.scripts]
studio = "studio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["studio*", "tools*"]

[tool.setuptools.package-data]
"studio.gui" = ["static/*"]
"tools" = ["bone_maps/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
