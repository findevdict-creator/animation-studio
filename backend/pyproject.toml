[project]
name = "studio-backend"
version = "0.1.0"
description = "FastAPI modular monolith for the cartoon production platform."
requires-python = ">=3.13"
dependencies = [
    "studio-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "boto3>=1.35",
    "celery[redis]>=5.4",
    "pyjwt[crypto]>=2.9",
    "tzdata",  # zoneinfo data for Celery/kombu on images without the OS package
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "jsonschema>=4.23"]
# Provider SDKs, imported lazily: install the ones a deployment uses (the ai worker image has all three).
ai = ["anthropic>=2.4", "openai>=3.40", "google-genai>=2.30"]

[project.entry-points.pytest11]
studio = "studio_testing.plugin"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "studio_testing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
